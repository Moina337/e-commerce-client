<section class="auth">
  <div class="auth__card">
    <h1>Créer un compte</h1>
    <p class="auth__intro">Inscrivez-vous pour passer commande et suivre vos achats.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span>Nom</span>
        <input type="text" formControlName="name" autocomplete="name" />
        @if (form.controls.name.touched && form.controls.name.invalid) {
          <small class="field__error">Le nom est obligatoire (100 caractères maximum).</small>
        }
      </label>

      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="field__error">Saisissez un email valide.</small>
        }
      </label>

      <label class="field">
        <span>Mot de passe</span>
        <input type="password" formControlName="password" autocomplete="new-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="field__error">8 caractères minimum.</small>
        }
      </label>

      <label class="field">
        <span>Confirmer le mot de passe</span>
        <input type="password" formControlName="confirm" autocomplete="new-password" />
        @if (form.controls.confirm.touched && form.hasError('mismatch')) {
          <small class="field__error">Les mots de passe ne correspondent pas.</small>
        }
      </label>

      @if (error()) {
        <p class="auth__error" role="alert">{{ error() }}</p>
      }

      <app-button type="submit" [fullWidth]="true" [disabled]="saving()">
        {{ saving() ? 'Création…' : 'Créer mon compte' }}
      </app-button>
    </form>

    <p class="auth__switch">
      Déjà inscrit ? <a routerLink="/login">Se connecter</a> <!-- ADAPTER -->
    </p>
  </div>
</section>
