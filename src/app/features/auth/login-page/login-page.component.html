<section class="auth">
  <div class="auth__card">
    <h1>Connexion</h1>
    <p class="auth__intro">Accédez à votre compte pour commander et suivre vos achats.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="field__error">Saisissez un email valide.</small>
        }
      </label>

      <label class="field">
        <span>Mot de passe</span>
        <input type="password" formControlName="password" autocomplete="current-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="field__error">Le mot de passe est obligatoire.</small>
        }
      </label>

      @if (error()) {
        <p class="auth__error" role="alert">{{ error() }}</p>
      }

      <app-button type="submit" [fullWidth]="true" [disabled]="saving()">
        {{ saving() ? 'Connexion…' : 'Se connecter' }}
      </app-button>
    </form>

    <p class="auth__switch">
      Pas encore de compte ? <a routerLink="/register">Créer un compte</a> <!-- ADAPTER -->
    </p>
  </div>
</section>
