<section class="category-list">
  <header class="page-header">
    <div>
      <p class="eyebrow">CATALOGUE</p>
      <h1>Catégories</h1>
      <p class="subtitle">Consultez les catégories de votre boutique.</p>
    </div>
  </header>

  @if (categories().length === 0) {
    <p class="empty-state" role="status">Aucune catégorie à afficher.</p>
  } @else {
    <div class="table-container">
      <table mat-table [dataSource]="categories()" aria-label="Liste des catégories">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nom</th>
          <td mat-cell *matCellDef="let category">{{ category.name }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let category">{{ category.description }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Statut</th>
          <td mat-cell *matCellDef="let category">
            <span
              class="status"
              [class.status-active]="category.active"
              [class.status-inactive]="!category.active"
            >
              {{ category.active ? 'Active' : 'Inactive' }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let category">
            <button
              mat-button
              type="button"
              disabled
              [attr.aria-label]="'Actions indisponibles pour ' + category.name"
            >
              Gérer
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  }
</section>
