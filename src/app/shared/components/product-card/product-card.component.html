<article class="card">
  <a class="card__image" [routerLink]="['/shop/product', product().slug]">
    <img
      [src]="productImage"
      [alt]="product().name || 'Image du produit'"
      loading="lazy"
      (error)="onImageError($event)"
    />
  </a>

  <div class="card__body">
    <p class="card__category">
      {{ product().category?.name || 'Sans catégorie' }}
    </p>

    <h3 class="card__name">
      <a [routerLink]="['/shop/product', product().slug]">
        {{ product().name || 'Produit sans nom' }}
      </a>
    </h3>

   <app-price class="card__price" [value]="product().price" />

  <app-add-to-cart [product]="product()" />
    
  </div>
</article>
